name: CREN newsroom health

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: cren-newsroom-health
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check newsroom run, draft, and publication freshness
        id: health
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          npm run newsroom:automation-health 2>&1 | tee newsroom-health.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsroom-health-report
          path: frontend/newsroom-health.log
          retention-days: 14

      - name: Open or update a newsroom alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('frontend/newsroom-health.log', 'utf8'); } catch {}
            const title = 'CREN newsroom automation unhealthy';
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'newsroom-health' });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'newsroom-health',
                color: 'B60205',
                description: 'CREN newsroom automation health alert',
              });
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'newsroom-health',
            });
            const body = [
              `The newsroom health check failed at ${new Date().toISOString()}.`,
              '',
              '```json',
              log.slice(-6000) || '{"error":"no health output"}',
              '```',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, labels: ['newsroom-health'], body });
            }

      - name: Close the alert issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'CREN newsroom automation unhealthy';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'newsroom-health',
            });
            for (const issue of issues.filter((entry) => entry.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: the newsroom health check passed at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
            }
