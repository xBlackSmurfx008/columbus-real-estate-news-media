name: Site quality gate

# Product-layer quality gates (owner plan 2026-09-04, item 12):
# links, sources, stale statistics, author taxonomy, disclosures, lead-form
# submission, analytics events, schema markup, indexability, canonicals, image
# integrity, performance.
#
# IMPORTANT — read before trusting a green tick here. A previous scheduled
# workflow on this repository failed 34 consecutive runs at the GitHub Actions
# billing/environment level and nobody noticed, because a run that never starts
# looks like nothing at all. So:
#
#   * this workflow is designed to be equally useful run BY HAND:
#         cd frontend && npm ci && npm run verify:site
#     with DATABASE_URL exported for the database-backed checks.
#   * `verify-site.mjs` itself reports SKIPPED, with a reason, for anything it
#     could not run — a missing secret can never masquerade as a pass.
#   * the "assert the gate actually produced a report" step below fails the job
#     when the script emits nothing, so a broken runner is loud rather than
#     silent.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "production | local | an absolute URL"
        required: false
        default: "production"
      full:
        description: "Check every sitemap URL instead of a sample"
        type: boolean
        required: false
        default: false
  schedule:
    # 07:15 America/New_York-ish, after the 06:33 newsroom routine has published.
    - cron: "15 11 * * *"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/site-quality.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit-test the gate's own helpers
        run: npm run test:site-quality

      - name: Run the site quality gate
        id: gate
        env:
          # Optional. Absent secrets make the database-backed checks report
          # SKIPPED with a reason; they never silently pass.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/verify-site.mjs \
            --target "${{ github.event.inputs.target || 'production' }}" \
            ${{ github.event.inputs.full == 'true' && '--full' || '' }} \
            2>&1 | tee site-quality.log
        continue-on-error: true

      - name: Capture the machine-readable report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --experimental-strip-types scripts/verify-site.mjs \
            --target "${{ github.event.inputs.target || 'production' }}" \
            --only links,indexability,canonicals,schema \
            --json > site-quality.json || true

      - name: Assert the gate actually produced a report
        run: |
          if [ ! -s site-quality.log ]; then
            echo "The site quality gate produced no output at all."
            echo "That is an environment failure, not a passing run. Failing loudly."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-quality-report
          path: |
            frontend/site-quality.log
            frontend/site-quality.json
          retention-days: 14

      - name: Fail the job when a blocking check failed
        if: steps.gate.outcome != 'success'
        run: |
          echo "Blocking site-quality failures — see the log above."
          exit 1

      - name: Open or update an alert issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('frontend/site-quality.log', 'utf8'); } catch {}
            const tail = log.split('\n').slice(-60).join('\n');
            const title = 'Site quality gate failing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'site-quality',
            });
            const body = [
              `The scheduled site quality gate failed at ${new Date().toISOString()}.`,
              '',
              '```',
              tail || '(no output captured — treat this as an environment failure)',
              '```',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['site-quality'],
                body,
              });
            }

      - name: Close the alert issue on recovery
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Site quality gate failing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'site-quality',
            });
            for (const issue of issues.filter((entry) => entry.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: the site quality gate passed at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
